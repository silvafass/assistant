[package]
name = "assistant"
version = "0.1.0"
edition = "2024"
default-run = "assist"

[[bin]]
name = "assist"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.102"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive", "serde_derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1.18"
