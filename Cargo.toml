[package]
name = "assistant"
version = "0.1.0"
edition = "2024"
default-run = "assist"

[[bin]]
name = "assist"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive", "serde_derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = "0.1.19"
