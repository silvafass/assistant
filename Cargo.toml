[package]
name = "assistant"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
rustyline = "18.0.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
